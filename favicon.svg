<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0620"/><stop offset="1" stop-color="#16093a"/></linearGradient>
    <linearGradient id="sn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a8fd0"/><stop offset="1" stop-color="#7dffc0"/></linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- isometric cube -->
  <g stroke="#20e0ff" stroke-width="1.2" stroke-linejoin="round">
    <polygon points="32,10 54,22 32,34 10,22" fill="#1d3550"/>
    <polygon points="10,22 32,34 32,56 10,44" fill="#132538"/>
    <polygon points="54,22 32,34 32,56 54,44" fill="#0e1c2c"/>
  </g>
  <!-- grid hints -->
  <g stroke="#20e0ff" stroke-width="0.6" opacity="0.5">
    <line x1="21" y1="16" x2="43" y2="28"/><line x1="43" y1="16" x2="21" y2="28"/>
    <line x1="21" y1="33" x2="21" y2="50"/><line x1="43" y1="33" x2="43" y2="50"/>
    <line x1="10" y1="33" x2="32" y2="45"/><line x1="54" y1="33" x2="32" y2="45"/>
  </g>
  <!-- snake wrapping over the top edge onto the front face -->
  <path d="M14,20 L28,13 L40,20 L40,40" fill="none" stroke="#08202a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M14,20 L28,13 L40,20 L40,40" fill="none" stroke="url(#sn)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="40" cy="41" r="3.6" fill="#a0ffd0"/>
  <circle cx="41.5" cy="40" r="0.9" fill="#052"/>
  <!-- food -->
  <circle cx="20" cy="40" r="3" fill="#ff4d6a"/>
</svg>
