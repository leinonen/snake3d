  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Courier New",monospace;user-select:none}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;top:18px;left:24px;color:#bff;font-size:34px;font-weight:bold;letter-spacing:2px;text-shadow:0 0 10px #0ff;pointer-events:none;transform-origin:left top;transition:transform .25s ease-out,color .25s}
  #hud.pop{transform:scale(1.25);color:#fff;transition:none}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:42px;

<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="msg"></div>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------- cube topology
const N = 10, S = 2 / N;               // cells per face edge, cell size (cube spans [-1,1])
// u x v = n for every face; grid cell (i,j) lives at n + u*((i+.5)*S-1) + v*((j+.5)*S-1)
const FACES = [
  { n:[ 0, 0, 1], u:[ 1,0, 0], v:[0,1, 0], tint:[0.10,0.16,0.22] },
  { n:[ 0, 0,-1], u:[-1,0, 0], v:[0,1, 0], tint:[0.18,0.10,0.20] },
  { n:[ 1, 0, 0], u:[ 0,0,-1], v:[0,1, 0], tint:[0.10,0.20,0.16] },
  { n:[-1, 0, 0], u:[ 0,0, 1], v:[0,1, 0], tint:[0.20,0.16,0.10] },
  { n:[ 0, 1, 0], u:[ 1,0, 0], v:[0,0,-1], tint:[0.12,0.12,0.22] },
  { n:[ 0,-1, 0], u:[ 1,0, 0], v:[0,0, 1], tint:[0.20,0.12,0.12] },
];
const dot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const add = (a,b,t=1) => [a[0]+b[0]*t, a[1]+b[1]*t, a[2]+b[2]*t];
const neg = a => [-a[0],-a[1],-a[2]];
const faceOfNormal = d => FACES.findIndex(f => dot(f.n,d) > 0.5);

function cellPos(f,i,j){
  const F = FACES[f];
  return add(add(F.n, F.u, (i+0.5)*S-1), F.v, (j+0.5)*S-1);
}
// advance one cell along world direction d; wrap onto neighbouring face at edges
function step(seg, d){
  const F = FACES[seg.f];
  const ni = seg.i + Math.round(dot(d,F.u)), nj = seg.j + Math.round(dot(d,F.v));
  if (ni>=0 && ni<N && nj>=0 && nj<N) return { seg:{f:seg.f,i:ni,j:nj}, d };
  const g = faceOfNormal(d), G = FACES[g], nd = neg(F.n);
  const p = cellPos(seg.f, seg.i, seg.j);
  const q = add(add(p, d, S/2), nd, S/2);       // walk over the edge and fold down
  const gi = Math.round((dot(q,G.u)+1)/S - 0.5), gj = Math.round((dot(q,G.v)+1)/S - 0.5);
  return { seg:{f:g,i:gi,j:gj}, d:nd };
}
const key = s => s.f*N*N + s.j*N + s.i;

// ---------------------------------------------------------------- game state
let snake, dir, pendingDir, food, score, alive, tickAcc, tickMs, shake, started, best = 0;
let combo, comboTimer, hitStop, surge, surgeT, flash, starT = 0, foodCount;
let rocks, lavaFace, lavaPhase, lavaT, lavaCd;
let powerup, ghostT, slowT, effectLbl = '';
let noteTxt = '', noteT = 0, deathMsg = '';
function note(txt, secs=1.5){ noteTxt = txt; noteT = secs; hud(); }
function reset(){
  snake = [{f:0,i:5,j:5},{f:0,i:4,j:5},{f:0,i:3,j:5}];
  dir = [1,0,0]; pendingDir = null;
  score = 0; alive = true; tickAcc = 0; tickMs = 170; shake = 0; started = false;
  combo = 0; comboTimer = 0; hitStop = 0; surge = 0; surgeT = 0; flash = 0; foodCount = 0;
  rocks = []; lavaFace = -1; lavaPhase = null; lavaT = 0; lavaCd = 12; music.duck(false);
  powerup = null; ghostT = 0; slowT = 0; effectLbl = ''; music.slow(false);
  tiltV = [0,0,0]; noteTxt = ''; noteT = 0;
  spawnFood();
  targetQ = faceQ(0);
  hud();
}
function freeCell(excludeFaces){
  const occ = new Set([...snake, ...rocks, ...(food?[food]:[]), ...(powerup?[powerup]:[])].map(key));
  let c;
  do { c = { f:(Math.random()*6)|0, i:(Math.random()*N)|0, j:(Math.random()*N)|0 }; }
  while (occ.has(key(c)) || excludeFaces.includes(c.f));
  return c;
}
function spawnFood(){
  const ex = lavaPhase ? [lavaFace] : [];
  food = freeCell(ex);
  food.ttl = food.ttl0 = Math.max(4, 9 - score*0.1);
  if (!powerup && Math.random() < 0.2){
    powerup = freeCell(ex); powerup.kind = ['ghost','shrink','slow'][(Math.random()*3)|0]; powerup.ttl = 8;
  }
}
const PU_COL = { ghost:[0.3,1.0,1.0], shrink:[1.0,0.3,1.0], slow:[1.0,1.0,1.0] };
function spawnRock(){
  if (rocks.length >= 24) return;
  const ex = [snake[0].f, faceOfNormal(dir)]; if (lavaPhase) ex.push(lavaFace);
  const r = freeCell(ex); r.seed = Math.random()*1000; rocks.push(r);
}
function tick(){
  if (pendingDir){ dir = pendingDir; pendingDir = null; }
  if (comboTimer>0 && --comboTimer===0 && combo>1){ combo = 0; sfx.comboLost(); hud(); }
  const r = step(snake[0], dir);
  dir = r.d;
  const h = r.seg, hk = key(h);
  const eat = hk === key(food);
  const body = eat ? snake : snake.slice(0,-1);
  const rockHit = rocks.some(r => key(r)===hk), lavaHit = lavaPhase==='active' && h.f===lavaFace;
  if (rockHit) sfx.rock();
  const selfHit = ghostT<=0 && body.some(s => key(s)===hk);
  if (selfHit || rockHit || lavaHit){
    deathMsg = rockHit ? 'you crashed into a rock' : lavaHit ? 'you ran onto a collapsing face' : 'you bit your own tail';
    alive = false; shake = 1; hitStop = 0.15; sfx.die(); music.stop(); best = Math.max(best,score); hud(); return; }
  if (h.f !== snake[0].f){ onFaceChange(snake[0].f, h.f); }
  snake.unshift(h);
  if (eat){
    combo = comboTimer>0 ? combo+1 : 1; comboTimer = 12; foodCount++;
    score += combo + (food.ttl > food.ttl0*0.5 ? 2 : 0); sfx.eat(combo);
    if (foodCount%3===0) spawnRock();
    hitStop = 0.04; shake = Math.max(shake, 0.25); flash = 1; hudPop();
    music.setIntensity(Math.min(3, Math.floor(score/5))); music.setCombo(combo);
    if (foodCount%5===0) music.fill();
    tickMs = Math.max(70, 170 - foodCount*4); spawnFood();
  }
  else snake.pop();
  if (powerup && key(powerup)===hk){
    const k = powerup.kind; powerup = null; sfx.power(); hudPop();
    if (k==='ghost'){ ghostT = 5; surgeT = 5; }
    else if (k==='shrink'){ snake.length = Math.max(3, Math.ceil(snake.length*0.7)); sfx.pop(); surgeT = 1; }
    else { slowT = 4; music.slow(true); surgeT = 4; }
  }
  hud();
}
function hudPop(){ const h=document.getElementById('hud'); h.classList.remove('pop'); void h.offsetWidth; h.classList.add('pop'); }
function hud(){
  document.getElementById('hud').textContent = `SCORE ${score}   BEST ${best}   LEN ${snake.length}` + (combo>1 ? `   x${combo}` : '') + (effectLbl ? `   ${effectLbl}` : '');
  document.getElementById('msg').textContent =
    !alive ? `GAME OVER\n${deathMsg}\nscore ${score}\n\npress SPACE to restart` :
    lavaPhase==='warn' ? `!! FACE COLLAPSING !!` :
    noteT > 0 ? noteTxt :
    !started ? `CUBE SNAKE\n\narrows / WASD to move\nedges wrap onto the next face\nM = mute music` : '';
}

// ---------------------------------------------------------------- quaternion camera
function mat3ToQuat(m){ // m rows = [u,v,n] (world -> view)
  const t = m[0][0]+m[1][1]+m[2][2]; let q;
  if (t>0){ const s=Math.sqrt(t+1)*2; q=[(m[2][1]-m[1][2])/s,(m[0][2]-m[2][0])/s,(m[1][0]-m[0][1])/s,s/4]; }
  else if (m[0][0]>m[1][1] && m[0][0]>m[2][2]){ const s=Math.sqrt(1+m[0][0]-m[1][1]-m[2][2])*2; q=[s/4,(m[0][1]+m[1][0])/s,(m[0][2]+m[2][0])/s,(m[2][1]-m[1][2])/s]; }
  else if (m[1][1]>m[2][2]){ const s=Math.sqrt(1+m[1][1]-m[0][0]-m[2][2])*2; q=[(m[0][1]+m[1][0])/s,s/4,(m[1][2]+m[2][1])/s,(m[0][2]-m[2][0])/s]; }
  else { const s=Math.sqrt(1+m[2][2]-m[0][0]-m[1][1])*2; q=[(m[0][2]+m[2][0])/s,(m[1][2]+m[2][1])/s,s/4,(m[1][0]-m[0][1])/s]; }
  return q;
}
function quatToMat3(q){
  const [x,y,z,w]=q;
  return [[1-2*(y*y+z*z), 2*(x*y-z*w), 2*(x*z+y*w)],
          [2*(x*y+z*w), 1-2*(x*x+z*z), 2*(y*z-x*w)],
          [2*(x*z-y*w), 2*(y*z+x*w), 1-2*(x*x+y*y)]];
}
function slerp(a,b,t){
  let d = a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3];
  if (d<0){ b=b.map(x=>-x); d=-d; }
  if (d>0.9995){ const r=a.map((x,i)=>x+(b[i]-x)*t); const l=Math.hypot(...r); return r.map(x=>x/l); }
  const th=Math.acos(d), s=Math.sin(th), wa=Math.sin((1-t)*th)/s, wb=Math.sin(t*th)/s;
  return a.map((x,i)=>x*wa+b[i]*wb);
}
const qmul = (a,b) => [
  a[3]*b[0] + a[0]*b[3] + a[1]*b[2] - a[2]*b[1],
  a[3]*b[1] - a[0]*b[2] + a[1]*b[3] + a[2]*b[0],
  a[3]*b[2] + a[0]*b[1] - a[1]*b[0] + a[2]*b[3],
  a[3]*b[3] - a[0]*b[0] - a[1]*b[1] - a[2]*b[2]];
const qconj = q => [-q[0],-q[1],-q[2],q[3]];
const qaxis = (ax,ang) => { const h=ang/2, sn=Math.sin(h); return [ax[0]*sn,ax[1]*sn,ax[2]*sn,Math.cos(h)]; };
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const faceQ = f => mat3ToQuat([FACES[f].u, FACES[f].v, FACES[f].n]);
let camQ = faceQ(0), targetQ = faceQ(0);
let tiltV = [0,0,0];                               // smoothed edge-peek tilt: world-space rotation vector
// on a face change, roll the target 90 degrees over the shared edge so screen-up stays continuous
function onFaceChange(fOld, fNew){
  const a = FACES[fOld].n, b = FACES[fNew].n;
  const r = qaxis(cross(a,b), Math.PI/2);          // world rotation taking n_old -> n_new
  targetQ = qmul(targetQ, qconj(r));
  const l = Math.hypot(...targetQ); targetQ = targetQ.map(x=>x/l);
}

// ---------------------------------------------------------------- audio (Web Audio synth, no assets)
let actx = null;
function audioInit(){ if (!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); } if (actx.state==='suspended') actx.resume(); }
function tone(freq, dur, {type='square', vol=0.12, slide=0, delay=0} = {}){
  if (!actx) return;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*slide), t0+dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g).connect(actx.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
const sfx = {
  start(){ [261.6,329.6,392,523.3].forEach((f,i)=>tone(f,0.18,{delay:i*0.08,type:'triangle',vol:0.15})); tone(1046.5,0.35,{delay:0.32,type:'sine',vol:0.1}); },
  eat(c=1){ const m=Math.pow(2,(c-1)/12); tone(660*m,0.08,{slide:2.0,vol:0.1}); tone(990*m,0.1,{delay:0.05,type:'triangle',vol:0.08}); },
  miss(){ tone(220,0.15,{type:'triangle',slide:0.6,vol:0.08}); },
  rock(){ tone(90,0.35,{type:'sawtooth',slide:0.4,vol:0.2}); },
  siren(){ for (let k=0;k<3;k++){ tone(880,0.22,{delay:k*0.5,type:'square',vol:0.07}); tone(660,0.22,{delay:k*0.5+0.25,type:'square',vol:0.07}); } },
  power(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.12,{delay:i*0.05,type:'square',vol:0.09})); },
  pop(){ tone(300,0.12,{slide:0.3,type:'triangle',vol:0.12,delay:0.2}); },
  restore(){ tone(523,0.12,{type:'triangle',vol:0.08}); tone(784,0.2,{delay:0.1,type:'triangle',vol:0.08}); },
  comboLost(){ tone(500,0.18,{type:'triangle',slide:0.5,vol:0.07}); },
  die(){ tone(400,0.6,{type:'sawtooth',slide:0.15,vol:0.18}); tone(200,0.8,{type:'square',slide:0.2,vol:0.1,delay:0.05}); },
};


// ---------------------------------------------------------------- chiptune (SID-style: PWM pulse, 50Hz arps, filter sweep)
const music = (() => {
  let bpm = 112, STEP = 60/bpm/4; const BARS = 8;
  let level = 0, comboLvl = 0, fillSteps = 0, ducked = false, slowed = false;
  const mtof = m => 440*Math.pow(2,(m-69)/12);
  // A minor, mostly static root — hypnotic, slow harmonic drift
  const CHORD = [[57,60,64],[57,60,64],[53,57,60],[53,57,60],[57,60,64],[57,60,64],[55,59,62],[52,55,59]];
  const ROOT  = [45,45,41,41,45,45,43,40];
  const L = (...n) => n;  // [step, midi, lenSteps]
  const LEAD = [
    [L(0,76,6),L(8,74,4),L(12,72,4)],
    [L(0,69,8),L(10,71,2),L(12,72,4)],
    [L(0,77,4),L(4,76,4),L(8,72,8)],
    [L(0,74,12)],
    [L(0,76,6),L(8,79,4),L(12,77,4)],
    [L(0,76,8),L(8,72,4),L(12,69,4)],
    [L(0,67,4),L(4,69,4),L(8,71,8)],
    [L(0,69,16)],
  ];
  // driving 16th bass: 0 rest, 1 root, 2 octave, 3 fifth
  const BASSPAT = [1,0,1,2, 1,0,1,3, 1,0,1,2, 1,0,2,3];
  const BASSOFF = {1:0, 2:12, 3:7};
  let timer=null, step=0, nextT=0, master=null, filt=null, noise=null, muted=false;

  function pulse(freq, t0, dur, o){
    const g = actx.createGain();
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(o.vol,t0+0.004);
    g.gain.setValueAtTime(o.vol,t0+Math.max(0.004,dur-0.03)); g.gain.linearRampToValueAtTime(0,t0+dur);
    const a=actx.createOscillator(), b=actx.createOscillator(); a.type=b.type='sawtooth';
    a.frequency.setValueAtTime(freq,t0); b.frequency.setValueAtTime(freq,t0);
    const inv=actx.createGain(); inv.gain.value=-1; const d=actx.createDelay(0.05);
    d.delayTime.setValueAtTime(o.duty0/freq,t0); d.delayTime.linearRampToValueAtTime(o.duty1/freq,t0+dur);
    a.connect(g); b.connect(inv); inv.connect(d); d.connect(g); g.connect(o.dest||filt);
    if (o.vib){ const l=actx.createOscillator(), lg=actx.createGain(); l.frequency.value=5.5; lg.gain.value=freq*0.012;
      l.connect(lg); lg.connect(a.frequency); lg.connect(b.frequency); l.start(t0); l.stop(t0+dur); }
    a.start(t0); b.start(t0); a.stop(t0+dur+0.01); b.stop(t0+dur+0.01);
    return [a,b];
  }
  function drum(t0, kind){
    if (kind==='kick'){ const o=actx.createOscillator(), g=actx.createGain(); o.type='square';
      o.frequency.setValueAtTime(160,t0); o.frequency.exponentialRampToValueAtTime(40,t0+0.09);
      g.gain.setValueAtTime(0.16,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+0.11);
      o.connect(g).connect(master); o.start(t0); o.stop(t0+0.12); }
    else { const src=actx.createBufferSource(); src.buffer=noise; const g=actx.createGain(), f=actx.createBiquadFilter();
      const hat = kind==='hat'; f.type='highpass'; f.frequency.value = hat?7000:1800;
      const dur = hat?0.025:0.08, v = hat?0.03:0.07;
      g.gain.setValueAtTime(v,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
      src.connect(f).connect(g).connect(master); src.start(t0); src.stop(t0+dur+0.01); }
  }
  function play(gs, t0){
    const bar = Math.floor(gs/16)%BARS, st = gs%16, phrase = Math.floor(gs/(16*BARS))%2;
    const ch = CHORD[bar], root = ROOT[bar];
    // bass: PWM pulse + sub sine
    const bp = BASSPAT[st];
    if (bp){ pulse(mtof(root+BASSOFF[bp]), t0, STEP*0.8, {vol:0.17, duty0:0.5, duty1:0.12}); }
    if (st===0 || st===8){ const o=actx.createOscillator(), g=actx.createGain(); o.type='sine'; o.frequency.value=mtof(root-12);
      g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(0.22,t0+0.02); g.gain.setValueAtTime(0.22,t0+STEP*7); g.gain.linearRampToValueAtTime(0,t0+STEP*8);
      o.connect(g).connect(master); o.start(t0); o.stop(t0+STEP*8+0.02); }
    // arp shimmer (50Hz chord cycle) on even steps once the game warms up
    if (level>=1 && (st&1)===0){ const [a,b] = pulse(mtof(ch[0]+24), t0, STEP*1.6, {vol:0.035, duty0:0.5, duty1:0.3});
      for (let k=0;k<9;k++){ const f=mtof(ch[k%3]+24); a.frequency.setValueAtTime(f,t0+k/50); b.frequency.setValueAtTime(f,t0+k/50); } }
    // lead: only every other 8-bar phrase — comes and goes
    if (phrase===1) for (const [ls,m,len] of LEAD[bar]) if (ls===st){
      pulse(mtof(m), t0, STEP*len*0.9, {vol:0.09, duty0:0.22, duty1:0.46, vib:true});
      if (level>=3) pulse(mtof(m-12), t0, STEP*len*0.9, {vol:0.04, duty0:0.4, duty1:0.2});
    }
    // drums: soft
    if (fillSteps>0){ fillSteps--; drum(t0,'snare'); }
    else { if (st===0||st===8) drum(t0,'kick'); if ((st===4||st===12) && level>=2) drum(t0,'snare'); if ((st&1) && level>=1) drum(t0,'hat'); }
    // slow filter breathing over 2 bars
    if (st===0 && !ducked){ const lo=700+300*comboLvl, hi=2600+300*comboLvl; filt.frequency.cancelScheduledValues(t0);
      filt.frequency.setValueAtTime(bar%2?hi:lo,t0); filt.frequency.exponentialRampToValueAtTime(bar%2?lo:hi,t0+STEP*16);
      STEP = 60/bpm/4*(slowed?2:1); }
  }
  function sched(){ while (nextT < actx.currentTime+0.2){ play(step,nextT); step=(step+1)%(16*BARS); nextT+=STEP; } }
  function start(){
    if (timer || !actx) return;
    if (!noise){ noise=actx.createBuffer(1,actx.sampleRate*0.5,actx.sampleRate); const d=noise.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
    master=actx.createGain(); master.gain.value = muted?0:0.35; master.connect(actx.destination);
    filt=actx.createBiquadFilter(); filt.type='lowpass'; filt.Q.value=3; filt.frequency.value=2000; filt.connect(master);
    step=0; level=0; comboLvl=0; fillSteps=0; slowed=false; bpm=112; STEP=60/bpm/4; nextT=actx.currentTime+0.4; timer=setInterval(sched,40);
  }
  function stop(){
    if (!timer) return; clearInterval(timer); timer=null;
    const m=master; m.gain.setTargetAtTime(0,actx.currentTime,0.08); setTimeout(()=>m.disconnect(),800);
  }

function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if (!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs,fs){
  const p = gl.createProgram();
  gl.attachShader(p,compile(gl.VERTEX_SHADER,vs)); gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);

}

const sceneProg = program(`

const postProg = program(`
  attribute vec2 aPos; varying vec2 vUv;
  void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }
`,`
  precision mediump float;
  varying vec2 vUv; uniform sampler2D uTex; uniform vec2 uRes; uniform float uTime; uniform float uShake; uniform float uDead; uniform float uSurge; uniform float uStar; uniform float uGhost;
  float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
  // warp starfield: 8 depth slices fly toward the camera; each star projected by 1/z
  vec3 starfield(vec2 p, float t){
    vec3 c = vec3(0.0);
    vec2 rad = normalize(p + 1e-5), tng = vec2(-rad.y, rad.x);
    for(int i=0;i<8;i++){
      float fi = float(i);
      float z = fract(fi/8.0 - t*0.10);                   // 1 = far, 0 = at camera
      vec2 pp = p*z*14.0 + fi*3.7;                        // plane-space coords
      vec2 cell = floor(pp), fr = fract(pp) - 0.5;
      float h = hash(cell + fi*11.0);

        vec2 sp = (vec2(hash(cell+1.3), hash(cell+7.1)) - 0.5)*0.8;
        vec2 d = fr - sp;

        float s = exp(-(dr*dr/streak + dt*dt) * 900.0 / (z*z + 0.002));

    uv += (vec2(hash(vec2(uTime,1.0)),hash(vec2(2.0,uTime)))-0.5)*0.03*uShake;
    vec2 off = (vUv-0.5)*(0.008 + 0.03*uShake + 0.008*uSurge);  // chromatic aberration

    }
    float r = texture2D(uTex,uv+off).r;

      float l = max(dot(s,vec3(0.299,0.587,0.114))-0.35,0.0);
      float w = exp(-float(x*x+y*y)*0.12);

    // background where nothing was drawn
    vec3 bg = mix(vec3(0.01,0.01,0.04), vec3(0.06,0.01,0.10), vUv.y+0.2*sin(uTime*0.3));
    bg += starfield(cc, uStar)*(1.0+0.4*uSurge);

    col = mix(col, col.bgr*1.2, uGhost*(0.7+0.3*sin(uTime*8.0)));  // ghost mode tint
    col *= 0.90 + 0.10*sin(uv.y*uRes.y*1.6 + uTime*4.0);      // scanlines
    col *= 1.0 - 0.55*r2;                                      // vignette
    col += (hash(vUv*uTime)-0.5)*0.03;                         // grain
    col = mix(col, vec3(dot(col,vec3(0.3,0.59,0.11)))*vec3(1.2,0.5,0.6), uDead*0.7);
    float inside = step(0.0,uv.x)*step(uv.x,1.0)*step(0.0,uv.y)*step(uv.y,1.0);

  }
`);

// ---------------------------------------------------------------- geometry
const verts = [];  // interleaved: pos3 col3 nrm3 uv2
function quad(p0,p1,p2,p3,col,nrm,uvs){
  const tri = (a,b,c,ua,ub,uc) => { for (const [p,u] of [[a,ua],[b,ub],[c,uc]]) verts.push(p[0],p[1],p[2],col[0],col[1],col[2],nrm[0],nrm[1],nrm[2],u[0],u[1]); };
  const uv = uvs || [[0.5,0.5],[0.5,0.5],[0.5,0.5],[0.5,0.5]];
  tri(p0,p1,p2,uv[0],uv[1],uv[2]); tri(p0,p2,p3,uv[0],uv[2],uv[3]);
}
function cellQuad(f,i,j,col){
  const F=FACES[f], c=cellPos(f,i,j), h=S/2;
  const p = (a,b) => add(add(c,F.u,a*h),F.v,b*h);
  quad(p(-1,-1),p(1,-1),p(1,1),p(-1,1),col,F.n,[[0,0],[1,0],[1,1],[0,1]]);
}
// rounded, connected blob on a cell. nb = {px,nx,py,ny}: null = free side (rounded), number = extension past cell edge
function blob(f,i,j,nb,inset,H,col){
  const F=FACES[f], c=cellPos(f,i,j), h=S/2;
  const ext = v => v==null ? h*(1-inset) : h+v;
  const ex = {1:ext(nb.px), [-1]:ext(nb.nx)}, ey = {1:ext(nb.py), [-1]:ext(nb.ny)};
  const free = {x:{1:nb.px==null, [-1]:nb.nx==null}, y:{1:nb.py==null, [-1]:nb.ny==null}};
  const P = [];
  const corners = [[1,1,0],[-1,1,90],[-1,-1,180],[1,-1,270]];
  for (const [sx,sy,a0] of corners){
    if (free.x[sx] && free.y[sy]){
      const r = Math.min(ex[sx],ey[sy])*0.9, cx = sx*(ex[sx]-r), cy = sy*(ey[sy]-r), K=6;
      for (let k=0;k<=K;k++){ const an=(a0+k*90/K)*Math.PI/180; P.push([cx+r*Math.cos(an), cy+r*Math.sin(an)]); }
    } else if (!free.x[sx] && !free.y[sy]){
      // inner corner of a bend: notch back to tube width with a concave fillet
      const wx = h*(1-inset), wy = h*(1-inset), ri = Math.min(wx,wy)*0.35, K=4;
      const pts = [[ex[sx], wy]];
      for (let k=0;k<=K;k++){ const an=(270-k*90/K)*Math.PI/180; pts.push([wx+ri+ri*Math.cos(an), wy+ri+ri*Math.sin(an)]); }
      pts.push([wx, ey[sy]]);
      if (sx*sy<0) pts.reverse();
      for (const q of pts) P.push([sx*q[0], sy*q[1]]);
    } else P.push([sx*ex[sx], sy*ey[sy]]);
  }
  const M = P.length;
  const en = P.map((p,k)=>{ const q=P[(k+1)%M]; const dx=q[0]-p[0], dy=q[1]-p[1], l=Math.hypot(dx,dy)||1; return [dy/l,-dx/l]; });
  const pn = P.map((p,k)=>{ const a=en[(k-1+M)%M], b=en[k]; const x=a[0]+b[0], y=a[1]+b[1], l=Math.hypot(x,y)||1; return [x/l,y/l]; });
  const W = (a,b,z) => add(add(add(c,F.u,a),F.v,b),F.n,z);
  const d = Math.min(H*0.5, h*0.15), h1 = H*0.55;
  const top = P.map((p,k)=>W(p[0]-pn[k][0]*d, p[1]-pn[k][1]*d, H));
  const mid = P.map(p=>W(p[0],p[1],h1)), bot = P.map(p=>W(p[0],p[1],0));
  const centre = W(0,0,H), side = col.map(x=>x*0.75), topc = col.map(x=>x*0.9);
  for (let k=0;k<M;k++){
    const k1=(k+1)%M;
    verts.push(...centre,...col,...F.n,0.5,0.5, ...top[k],...col,...F.n,0.5,0.5, ...top[k1],...col,...F.n,0.5,0.5);
    const nOut = add(add([0,0,0],F.u,en[k][0]),F.v,en[k][1]);
    const nBev = add(nOut,F.n,1.0), l=Math.hypot(...nBev), nb2 = nBev.map(x=>x/l);
    quad(bot[k],bot[k1],mid[k1],mid[k], side, nOut);
    quad(mid[k],mid[k1],top[k1],top[k], topc, nb2);
  }
}
// jagged crystal spike cluster; per-vertex colour gradient dark base -> hot tip
function spikes(f,i,j,seed,t){
  const F=FACES[f], c=cellPos(f,i,j), h=S/2;
  const rnd = k => { const x=Math.sin(seed*12.9898 + k*78.233)*43758.5453; return x-Math.floor(x); };
  const W = (a,b,z) => add(add(add(c,F.u,a),F.v,b),F.n,z);
  const glow = 0.6+0.4*Math.sin(t*5+seed);
  const hot = [1.0, 0.15+0.25*glow, 0.05], dark = [0.12,0.03,0.05];
  const cone = (cx,cy,r,ht,np,k0) => {
    const apex = W(cx+(rnd(k0)-0.5)*r*0.5, cy+(rnd(k0+1)-0.5)*r*0.5, ht);
    const base = [];
    for (let k=0;k<np;k++){ const an=k/np*Math.PI*2, rr=r*(0.6+0.5*rnd(k0+2+k)); base.push(W(cx+Math.cos(an)*rr, cy+Math.sin(an)*rr, 0)); }
    for (let k=0;k<np;k++){
      const a=base[k], b=base[(k+1)%np];
      const e1=[b[0]-a[0],b[1]-a[1],b[2]-a[2]], e2=[apex[0]-a[0],apex[1]-a[1],apex[2]-a[2]];
      const n=cross(e1,e2), l=Math.hypot(...n)||1; const nn=n.map(x=>x/l);
      const shade = 0.7+0.3*rnd(k0+9+k), sc = dark.map(x=>x*shade);
      verts.push(...a,...sc,...nn,0.5,0.5, ...b,...sc,...nn,0.5,0.5, ...apex,...hot,...nn,0.5,0.5);
    }
  };
  cone(0,0, h*0.7, 0.16+0.03*rnd(50), 7, 0);
  const ns = 2+Math.floor(rnd(60)*2);
  for (let q=0;q<ns;q++){ const an=rnd(70+q)*Math.PI*2, d=h*0.55; cone(Math.cos(an)*d, Math.sin(an)*d, h*0.32, 0.07+0.04*rnd(80+q), 5, 100+q*20); }
}
function localDir(seg, other, H){
  const F=FACES[seg.f];
  if (other.f===seg.f) return [Math.sign(other.i-seg.i), Math.sign(other.j-seg.j), 0];
  const G=FACES[other.f]; return [Math.round(dot(G.n,F.u)), Math.round(dot(G.n,F.v)), H];
}
function buildScene(t){
  verts.length = 0;
  const rockSet = new Set(rocks.map(key));
  for (let f=0; f<6; f++){
    let tint = FACES[f].tint;
    if (f===lavaFace){
      const m = lavaPhase==='warn' ? 0.5+0.5*Math.sin(t*18) : 1.0;
      tint = [tint[0]+(0.85-tint[0])*m, tint[1]+(0.08-tint[1])*m, tint[2]+(0.04-tint[2])*m];
    }
    for (let i=0;i<N;i++) for (let j=0;j<N;j++){
      const chk = ((i+j)&1) ? 1.0 : 0.85;
      const rk = rockSet.has(f*N*N + j*N + i);
      const dp = rk ? 0.5+0.5*Math.sin(t*5) : 0;
      cellQuad(f,i,j, rk ? [0.45+0.3*dp, 0.05, 0.08] : [tint[0]*chk,tint[1]*chk,tint[2]*chk]);
    }
  }
  for (const r of rocks) spikes(r.f,r.i,r.j,r.seed,t);
  const L = snake.length, H = 0.05, inset = 0.28;
  snake.forEach((s,k) => {
    const g = k/Math.max(L-1,1);
    let col = k===0 ? [0.6,1.0,0.7] : [0.1+0.15*g, 0.95-0.5*g, 0.35+0.4*g];
    if (ghostT>0 && k>0) col = col.map(x=>x*0.5);
    const nb = {px:null,nx:null,py:null,ny:null};
    for (const o of [snake[k-1], snake[k+1]]){
      if (!o) continue;
      const [dx,dy,e] = localDir(s,o,H);
      if (dx===1) nb.px=e; else if (dx===-1) nb.nx=e; else if (dy===1) nb.py=e; else if (dy===-1) nb.ny=e;
    }
    blob(s.f,s.i,s.j,nb, k===0 ? inset*(1-0.5*flash) : inset, k===0 ? H*(1+0.5*flash) : H, col);
  });
  // eyes
  { const s=snake[0], F=FACES[s.f], c=cellPos(s.f,s.i,s.j), h=S/2;
    const fd=[dot(dir,F.u),dot(dir,F.v)], sd=[-fd[1],fd[0]];
    for (const sg of [1,-1]){
      const ec=[fd[0]*0.22*h+sd[0]*sg*0.32*h, fd[1]*0.22*h+sd[1]*sg*0.32*h], r=0.1*h;
      const W=(a,b)=>add(add(add(c,F.u,a),F.v,b),F.n,H+0.004);
      quad(W(ec[0]-r,ec[1]-r),W(ec[0]+r,ec[1]-r),W(ec[0]+r,ec[1]+r),W(ec[0]-r,ec[1]+r),[0.02,0.02,0.05],F.n);
    }
  }
  const pulse = 0.5+0.5*Math.sin(t*6);
  if (powerup){
    const pc = PU_COL[powerup.kind], sp = 0.5+0.5*Math.sin(t*9);
    const blink = powerup.ttl < 2 && (Math.floor(powerup.ttl*6)&1);
    if (!blink) blob(powerup.f,powerup.i,powerup.j,{px:null,nx:null,py:null,ny:null}, 0.45-0.1*sp, 0.09, pc.map(x=>x*(0.7+0.3*sp)));
  }
  const urgent = food.ttl < 2.5;
  if (!urgent || (Math.floor(food.ttl*6)&1)===0)
    blob(food.f,food.i,food.j,{px:null,nx:null,py:null,ny:null}, 0.42-0.08*pulse, 0.06+0.02*pulse,
         urgent ? [1.0,0.85,0.2] : [1.0,0.25+0.2*pulse,0.35]);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.DYNAMIC_DRAW);
}

function mul4(a,b){ const o=new Array(16).fill(0); for(let i=0;i<4;i++)for(let j=0;j<4;j++)for(let k=0;k<4;k++)o[j*4+i]+=a[k*4+i]*b[j*4+k]; return o; }

let last = performance.now();
function frame(now){
  const dt = Math.min((now-last)/1000, 0.1); last = now;

  else if (alive && started){ tickAcc += dt*1000; const tm = tickMs*(slowT>0?2:1); while (tickAcc >= tm){ tickAcc -= tm; tick(); if(!alive) break; } }
  shake = Math.max(0, shake - dt*1.5);

  else surge = Math.max(0, surge - dt*2);
  flash = Math.max(0, flash - dt*8);
  starT += dt*(1 + 1.2*surge);
  if (alive && started && hitStop <= 0){
    food.ttl -= dt;
    if (powerup && (powerup.ttl -= dt) <= 0) powerup = null;
    if (ghostT > 0) ghostT -= dt;
    if (slowT > 0 && (slowT -= dt) <= 0) music.slow(false);
    const lbl = ghostT>0 ? `GHOST ${Math.ceil(ghostT)}` : slowT>0 ? `SLOW ${Math.ceil(slowT)}` : '';
    if (lbl !== effectLbl){ effectLbl = lbl; hud(); }
    if (noteT > 0 && (noteT -= dt) <= 0){ noteTxt = ''; hud(); }
    if (food.ttl <= 0){ spawnFood(); sfx.miss(); if (combo>1){ combo=0; comboTimer=0; hud(); } }
    if (!lavaPhase){
      if (score >= 8){ lavaCd -= dt; if (lavaCd <= 0){
        const ex=[snake[0].f, faceOfNormal(dir)]; do { lavaFace=(Math.random()*6)|0; } while (ex.includes(lavaFace));
        lavaPhase='warn'; lavaT=3; sfx.siren(); music.duck(true); if (food.f===lavaFace) spawnFood(); hud(); } }
    } else {
      lavaT -= dt;
      if (lavaT <= 0){
        if (lavaPhase==='warn'){ lavaPhase='active'; lavaT=5; hud(); }
        else { lavaPhase=null; lavaFace=-1; lavaCd=12; music.duck(false); sfx.restore(); note('FACE RESTORED'); }
      }
    }
  }

  // camera: slerp toward the face the head is on
  camQ = slerp(camQ, targetQ, 1 - Math.exp(-dt*8));
  // edge peek: tilt toward the edge the head is near so the neighbouring face is visible
  { const hd = snake[0], F = FACES[hd.f], half = (N-1)/2;
    // sub-cell head position: advance along travel direction by tick progress
    const frac = (alive && started) ? Math.min(1, tickAcc/(tickMs*(slowT>0?2:1))) : 0;
    const hi = hd.i + dot(dir,F.u)*frac, hj = hd.j + dot(dir,F.v)*frac;
    // tilt reaches 45deg exactly at the cube edge, so base(+90deg) + tilt(-45deg) after crossing
    // equals base + 45deg before it: the camera rolls over the edge continuously with the snake
    const edge = o => { const x = Math.max(-1, Math.min(1, (o-half)/(half+0.5))); const a = Math.max(0, Math.abs(x)-0.35)/0.65; return Math.sign(x)*a*a*(3-2*a); };
    const TILT = Math.PI/4, k = 1 - Math.exp(-dt*8);
    // target as a world-space rotation vector so it stays continuous when the face (and its axes) change
    const tgt = add(add([0,0,0], F.v, -edge(hi)*TILT), F.u, edge(hj)*TILT);
    tiltV = tiltV.map((x,q)=>x + (tgt[q]-x)*k);
    const ang = Math.hypot(...tiltV);
    var viewQ = ang > 1e-6 ? qmul(camQ, qaxis(tiltV.map(x=>x/ang), ang)) : camQ; }
  const R = quatToMat3(viewQ);
  // slight idle wobble
  const wob = alive ? 0.03 : 0.0;
  const view = [
    R[0][0],R[1][0],R[2][0],0,
    R[0][1],R[1][1],R[2][1],0,
    R[0][2],R[1][2],R[2][2],0,
    Math.sin(t*0.7)*wob, Math.cos(t*0.9)*wob, -4.3, 1 ];
  const proj = perspective((38 + 4*surge)*Math.PI/180, W/H, 0.1, 20);
  const mvp = mul4(proj, view);
  const rot = [R[0][0],R[1][0],R[2][0], R[0][1],R[1][1],R[2][1], R[0][2],R[1][2],R[2][2]];

  buildScene(t);

  // pass 1: scene -> fbo
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0,0,W,H);
  gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.useProgram(sceneProg);
  gl.uniformMatrix4fv(U.mvp,false,mvp);
  gl.uniformMatrix3fv(U.rot,false,rot);
  gl.uniform1f(U.stime,t);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  const st = 11*4;
  gl.enableVertexAttribArray(A.pos); gl.vertexAttribPointer(A.pos,3,gl.FLOAT,false,st,0);
  gl.enableVertexAttribArray(A.col); gl.vertexAttribPointer(A.col,3,gl.FLOAT,false,st,12);
  gl.enableVertexAttribArray(A.nrm); gl.vertexAttribPointer(A.nrm,3,gl.FLOAT,false,st,24);
  gl.enableVertexAttribArray(A.uv);  gl.vertexAttribPointer(A.uv,2,gl.FLOAT,false,st,36);
  gl.drawArrays(gl.TRIANGLES, 0, verts.length/11);
  gl.disableVertexAttribArray(A.pos); gl.disableVertexAttribArray(A.col);
  gl.disableVertexAttribArray(A.nrm); gl.disableVertexAttribArray(A.uv);

  // pass 2: post-process -> screen
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0,0,W,H);
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
  gl.useProgram(postProg);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboTex);
  gl.uniform1i(U.tex,0); gl.uniform2f(U.res,W,H); gl.uniform1f(U.time,t);
  gl.uniform1f(U.shake,shake); gl.uniform1f(U.dead, alive?0:1); gl.uniform1f(U.surge,surge); gl.uniform1f(U.star,starT); gl.uniform1f(U.ghost, ghostT>0 ? Math.min(1, ghostT*3) : 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, quadVbo);
  gl.enableVertexAttribArray(A.qpos); gl.vertexAttribPointer(A.qpos,2,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  gl.disableVertexAttribArray(A.qpos);

  requestAnimationFrame(frame);
}

reset();
resize();
requestAnimationFrame(frame);
})();
</script>
